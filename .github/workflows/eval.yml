name: eval

on:
  push:
  pull_request:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: LLM-as-judge eval (gate)
        env:
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
          JUDGE_BASE_URL: ${{ vars.JUDGE_BASE_URL }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
        run: |
          if [ -z "$JUDGE_API_KEY" ]; then
            echo "::notice::未配置 JUDGE_API_KEY，跳过评测。在 Settings → Secrets and variables → Actions 中添加。"
            exit 0
          fi
          python evals/judge.py --threshold 0.85

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/
          if-no-files-found: ignore
